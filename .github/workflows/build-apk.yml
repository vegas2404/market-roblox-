name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Solid splash screen
        run: |
          cat > android/app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">#3F51B5</item>
                  <item name="colorPrimaryDark">#303F9F</item>
                  <item name="colorAccent">#FF4081</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#0B0B0B</item>
                  <item name="windowSplashScreenAnimatedIcon">@android:color/transparent</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
                  <item name="android:background">#0B0B0B</item>
              </style>
          </resources>
          XML

      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foodcount-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
