<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>FoodCount</title>
<style>
:root{--bg:#0b0b0b;--card:#1a1a1a;--card2:#2a2a2a;--ink:#fff;--mute:#8e8e93;--acc:#0a84ff;--gd:#3a1f1d;--gb:#7d2a23;--grn:#34c759;--red:#ff453a;--org:#ff9f0a;--out:#555a;--pm:#ffffffa8;--seg:#636366;--glass:rgba(48,48,52,.55);--gline:rgba(255,255,255,.16);--ghi:rgba(255,255,255,.14);--gact:rgba(255,255,255,.12);--line:rgba(255,255,255,.08);color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme="light"]{--acc:#e8352b;--grn:#2fb350;--bg:#f2f2f2;--card:#fff;--card2:#ececec;--ink:#000;--mute:#6c6c70;--gd:#fde3e0;--gb:#f5aaa2;--out:#b5b5ba;--pm:#0008;--seg:#fff;--glass:rgba(255,255,255,.62);--gline:rgba(0,0,0,.08);--ghi:rgba(255,255,255,.9);--gact:rgba(0,0,0,.07);--line:rgba(0,0,0,.08);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.3 -apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:12px 14px 40px}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;padding:6px 4px 4px}.brand img{width:30px;height:30px;border-radius:8px}
.cta{width:100%;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;padding:14px;margin-bottom:14px}
.nav{display:flex;align-items:center;gap:6px;padding:6px 0 10px}
.arr{font-size:30px;line-height:1;color:var(--acc);padding:2px 12px}
.seg{margin:0 auto;display:flex;background:var(--card);border-radius:12px;padding:3px}
.seg button{font-size:14px;padding:7px 16px;border-radius:10px;font-weight:600;color:var(--ink)}
.seg button.on{background:var(--seg)}
.gear{color:var(--acc);padding:6px 8px;display:flex}
h1{margin:6px 4px 2px;font-size:27px;text-transform:capitalize;letter-spacing:-.02em}
.sub{margin:0 4px 12px;color:var(--mute);font-size:16px}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px}
.top{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px}
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.mu{color:var(--mute);font-size:15px}
.hr{height:1px;background:var(--card2);margin:16px 0}
.st{display:grid;grid-template-columns:1fr 1fr;gap:16px 10px}
.st span{display:block;color:var(--mute);font-size:14px}
.st b{display:block;font-size:21px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;color:var(--mute);font-weight:600;font-size:14px;padding:6px 0 8px;letter-spacing:.04em}
.d{height:66px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink);padding:0}
.d .n{font-size:17px;font-weight:500;min-width:30px;height:30px;line-height:30px;border-radius:15px;text-align:center}
.d.off .n{color:var(--mute)}
.d.out .n{color:var(--out)}
.d.has{background:var(--gd)}
.d.max{background:var(--gb)}
.d.today .n{background:var(--red);color:#fff;font-weight:700}
.d .a{font-size:12px;font-weight:600;line-height:1}
.d .p{font-size:10px;color:var(--pm);line-height:1}
.sec{margin:18px 6px 8px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--mute)}
.list{background:var(--card);border-radius:24px;overflow:hidden}
.wr{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--card2);width:100%;text-align:left}
.wr:last-child{border:0}
.wn{width:44px;text-align:center}
.wn small{display:block;font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.06em}
.wn b{font-size:24px;line-height:1}
.wm{flex:1;min-width:0}
.track{height:10px;background:var(--card2);border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;background:var(--acc);border-radius:5px}
.wm div.t{margin-top:8px;color:var(--mute);font-size:14px}
.wv{font-size:17px;font-weight:700;min-width:60px;text-align:right}
.hint{text-align:center;color:var(--mute);margin:18px 0 0;font-size:15px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--mute);opacity:.5;margin:-8px auto 14px}
.sh-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:16px}.sh-h b{font-size:17px}
.done{justify-self:end;color:var(--acc);font-weight:700;font-size:16px;padding:4px 0}
.grp{background:var(--card2);border-radius:18px;margin:0 0 16px;overflow:hidden}
.rw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:16px;cursor:pointer}
.rw:last-child{border:0}
.val{display:flex;align-items:center;gap:8px;color:var(--acc);font-weight:500;text-align:right}
.rw input{background:none;text-align:right;padding:0;border-radius:0;color:var(--acc);font-weight:500;width:110px;flex:none;font-size:16px}
.pcv{position:fixed;inset:0;z-index:40}
.pop{position:fixed;z-index:41;overflow:auto;border-radius:28px;padding:8px;background-image:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,0) 45%);background-color:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--gline);box-shadow:0 24px 60px rgba(0,0,0,.4),inset 0 1px 0 var(--ghi);transform-origin:top right;transform:scale(.88);opacity:0;transition:transform .24s cubic-bezier(.2,.9,.3,1.15),opacity .16s}
.pop.in{transform:scale(1);opacity:1}
.pi{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:13px 14px 13px 10px;border-radius:20px;font-size:16px;color:var(--ink)}
.pi i{width:24px;flex:none;font-style:normal;font-weight:700;visibility:hidden}
.pi.on i{visibility:visible}
.pi:active{background:var(--gact)}
.ov{position:fixed;inset:0;background:#0009;display:none;z-index:20;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:19px;text-transform:capitalize}
.en{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--card2);font-size:16px}
.en button{color:var(--red);font-size:26px;padding:0 8px}
.f{display:flex;gap:8px;margin-top:14px}
input,select{background:var(--card2);border:0;border-radius:12px;padding:13px 14px;min-width:0;font-size:16px}
input{flex:1}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc)}
.f button{background:var(--acc);border-radius:12px;padding:0 20px;font-weight:700;color:#fff}
label{display:block;margin:14px 0 6px;color:var(--mute);font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
select{width:100%}
</style>
</head>

addp:["Добавить покупку","Add purchase","Dodaj zakup","Додати покупку"],amt:["Сумма","Amount","Kwota","Сума"],add:["Добавить","Add","Dodaj","Додати"],dt:["Итого за день","Day total","Razem za dzień","Разом за день"],

lf:["Лимит на","Limit for","Limit na","Ліміт на"],save:["Сохранить","Save","Zapisz","Зберегти"],eg:["Например, 1500","e.g. 1500","np. 1500","напр., 1500"]};
var LCS={ru:"ru-RU",en:"en-GB",pl:"pl-PL",uk:"uk-UA"},LI={ru:0,en:1,pl:2,uk:3},LC,EL="ru";
function T(k,x){return I[k][LI[EL]].replace("{x}",x)}
function detLang(){var l=(navigator.language||"ru").slice(0,2).toLowerCase();return LCS[l]?l:"ru"}
function sysCur(){var r=((navigator.language||"").split("-")[1]||"").toUpperCase();var m={PL:"PLN",UA:"UAH",RU:"RUB",US:"USD",GB:"GBP",CZ:"CZK",CH:"CHF",CA:"CAD",TR:"TRY"};return m[r]||"EUR"}
function ec(){return S.cur==="auto"?sysCur():S.cur}
function setLang(){if(!LCS[S.lang]&&S.lang!=="auto")S.lang="auto";EL=S.lang==="auto"?detLang():S.lang;LC=LCS[EL];document.documentElement.lang=EL;$("vw").textContent=T("week");$("vm").textContent=T("month");$("hn").textContent=T("hint");$("cta").textContent="+ "+T("addp")}
function applyTheme(){var t=S.theme;if(t==="auto")t=window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="light"?"#f2f2f7":"#000000"}
function $(i){return document.getElementById(i)}
var now=new Date(),T0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
var view="month",cm=new Date(now.getFullYear(),now.getMonth(),1),ws=mon(T0);
function pad(n){return n<10?"0"+n:""+n}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function mon(d){var x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function tot(d){return(S.days[key(d)]||[]).reduce(function(a,b){return a+b},0)}
function lim(y,m){var k=y+"-"+pad(m+1);if(S.limits[k]!=null)return S.limits[k];var ks=Object.keys(S.limits).sort().filter(function(x){return x<=k});return ks.length?S.limits[ks[ks.length-1]]:0}
function norm(d){return lim(d.getFullYear(),d.getMonth())/dim(d.getFullYear(),d.getMonth())}
function iso(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);return Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7)}
function fmt(v){return(Math.round(v*100)/100).toLocaleString(LC,{maximumFractionDigits:2})}
function mny(v){return fmt(v)+" "+CUR[ec()]}
function pc(v){return Math.round(v)+"%"}
function mo(d){return d.toLocaleDateString(LC,{month:"short"}).replace(".","")}
function wdn(d,n){var s=d.toLocaleDateString(LC,{weekday:"short"}).replace(".","").toUpperCase();return n?s.slice(0,n):s}
function range(){var a=[],i;if(view==="month"){for(i=1;i<=dim(cm.getFullYear(),cm.getMonth());i++)a.push(new Date(cm.getFullYear(),cm.getMonth(),i))}else{for(i=0;i<7;i++)a.push(add(ws,i))}return a}
function sum(days){var s=0,n=0,c=0,rem=0,mx=null,mv=0;days.forEach(function(d){var t=tot(d);s+=t;n+=norm(d);if(t>0)c++;if(d>=T0)rem++;if(t>mv){mv=t;mx=d}});return{s:s,n:n,c:c,rem:rem,mx:mx,mv:mv}}

function render(){
 var days=range(),q=sum(days),used=q.n>0?q.s/q.n*100:0,left=q.n-q.s;
 $("vw").className=view==="week"?"on":"";$("vm").className=view==="month"?"on":"";
 if(view==="month"){var ml=lim(cm.getFullYear(),cm.getMonth());$("ti").textContent=cm.toLocaleDateString(LC,{month:"long"});$("su").textContent=cm.getFullYear()+" · "+T("limit")+" "+(ml?mny(ml):T("notset"))}
 else{$("ti").textContent=T("week")+" "+iso(ws);$("su").textContent=ws.getDate()+" "+mo(ws)+" – "+add(ws,6).getDate()+" "+mo(add(ws,6))+" · "+T("norm")+" "+mny(q.n)}
 var col=used>100?"var(--red)":used>85?"var(--org)":"var(--grn)",C=2*Math.PI*46;
 var h='<div class="top"><div class="ring"><svg width="104" height="104"><circle cx="52" cy="52" r="46" fill="none" stroke="var(--card2)" stroke-width="12"/><circle cx="52" cy="52" r="46" fill="none" stroke="'+col+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(Math.min(100,Math.max(used,q.s>0?2:0))/100*C)+' '+C+'"/></svg><b>'+pc(used)+'</b></div>'
  +'<div><div class="lbl">'+T("spent")+'</div><div class="big">'+fmt(q.s)+' '+CUR[ec()]+'</div><div class="mu">'+(q.n?T("ofl",fmt(q.n)):T("nol"))+'</div></div></div><div class="hr"></div>'
  +'<div class="st"><div><span>'+T("days")+'</span><b>'+q.c+'</b></div><div><span>'+T("avg")+'</span><b>'+(q.c?mny(q.s/q.c):"—")+'</b></div>'
  +'<div><span>'+(left<0?T("over"):T("left"))+'</span><b style="'+(left<0?"color:var(--red)":"color:var(--grn)")+'">'+(q.n?mny(Math.abs(left)):"—")+'</b></div>'
  +'<div><span>'+T("perday")+'</span><b>'+(q.n&&q.rem>0&&left>0?mny(left/q.rem):"—")+'</b></div></div>'
  +(q.mx?'<div class="hr"></div><div class="mu">'+T("mx")+' <b style="color:var(--ink)">'+q.mx.getDate()+" "+mo(q.mx)+" · "+mny(q.mv)+'</b></div>':'');
 $("sm").innerHTML=h;
 view==="month"?month(days,q):week(days,q);
}

function month(days,q){
 var m=cm.getMonth(),first=mon(days[0]),last=add(mon(days[days.length-1]),6),g="";
 for(var i=0;i<7;i++)g+='<div class="wd">'+wdn(new Date(2024,0,1+i),2)+'</div>';
 for(var d=new Date(first);d<=last;d=add(d,1)){
  var t=tot(d),inM=d.getMonth()===m,L=lim(d.getFullYear(),d.getMonth()),dw=d.getDay(),cl="d";
  if(!inM)cl+=" out";if(dw===0||dw===6)cl+=" off";
  if(t>0)cl+=(q.mx&&key(d)===key(q.mx)&&inM)?" max":" has";
  if(+d===+T0)cl+=" today";
  g+='<button class="'+cl+'" data-k="'+key(d)+'"><span class="n">'+d.getDate()+'</span>'+(t>0?'<span class="a">'+Math.round(t).toLocaleString(LC)+'</span>'+(L?'<span class="p">'+pc(t/L*100)+'</span>':''):'')+'</button>';
 }
 $("cal").innerHTML='<div class="grid">'+g+'</div>';
 var w="",cur=new Date(days[0]);
 while(cur<=days[days.length-1]){
  var a=cur,b=add(mon(cur),6);if(b>days[days.length-1])b=days[days.length-1];
  var part=[];for(var x=new Date(a);x<=b;x=add(x,1))part.push(new Date(x));
  var s=sum(part),u=s.n>0?s.s/s.n*100:0;
  w+='<button class="wr" data-w="'+key(mon(a))+'"><div class="wn"><small>'+T("wk")+'</small><b>'+iso(a)+'</b></div><div class="wm"><div class="track"><i style="width:'+Math.min(100,u)+'%;'+(u>100?"background:var(--org)":"")+'"></i></div><div class="t">'+(a.getDate()===b.getDate()?a.getDate()+" "+mo(a):a.getDate()+" – "+b.getDate()+" "+mo(b))+' · '+T("norm")+' '+fmt(s.n)+'</div></div><div class="wv">'+(s.s>0?fmt(s.s):"—")+'</div></button>';
  cur=add(b,1);
 }
 $("wk").innerHTML='<div class="sec">'+T("bw")+'</div><div class="list">'+w+'</div>';
 bind();
}

function week(days){
 var h="";
 days.forEach(function(d){var t=tot(d),n=norm(d),u=n>0?t/n*100:0;
  h+='<button class="wr" data-k="'+key(d)+'"><div class="wn"><small>'+wdn(d)+'</small><b'+(+d===+T0?' style="color:var(--red)"':'')+'>'+d.getDate()+'</b></div><div class="wm"><div class="track"><i style="width:'+Math.min(100,u)+'%;'+(u>100?"background:var(--org)":"")+'"></i></div><div class="t">'+mo(d)+' · '+T("norm")+' '+fmt(n)+'</div></div><div class="wv">'+(t>0?fmt(t):"—")+'</div></button>'});
 $("cal").innerHTML='<div class="list" style="background:none">'+h+'</div>';$("wk").innerHTML="";bind();
}
function bind(){
 Array.prototype.forEach.call(document.querySelectorAll("[data-k]"),function(b){b.onclick=function(){openDay(b.getAttribute("data-k"))}});
 Array.prototype.forEach.call(document.querySelectorAll("[data-w]"),function(b){b.onclick=function(){var p=b.getAttribute("data-w").split("-");ws=new Date(+p[0],+p[1]-1,+p[2]);view="week";render()}});
}
function openSheet(h){$("sh").innerHTML=h;$("ov").className="ov on"}
function closeSheet(){$("ov").className="ov"}
$("ov").onclick=function(e){if(e.target===$("ov"))closeSheet()};

function openDay(k){
 var arr=S.days[k]||[],p=k.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]),t=tot(d),L=lim(d.getFullYear(),d.getMonth());
 var h='<h3>'+d.toLocaleDateString(LC,{day:"numeric",month:"long"})+'</h3><div class="mu">'+d.toLocaleDateString(LC,{weekday:"long"})+'</div>';
 arr.forEach(function(v,i){h+='<div class="en"><span>'+mny(v)+'</span><button data-i="'+i+'" aria-label="×">×</button></div>'});
 h+='<div class="en" style="border:0"><b>'+T("dt")+'</b><b>'+mny(t)+'</b></div>';
 if(L)h+='<div class="mu">'+T("pml",pc(t/L*100))+'</div>';
 h+='<div class="f"><input id="am" type="number" inputmode="decimal" min="0" placeholder="'+T("amt")+', '+CUR[ec()]+'"><button id="ad">'+T("add")+'</button></div>';
 openSheet(h);
 Array.prototype.forEach.call($("sh").querySelectorAll(".en button"),function(b){b.onclick=function(){arr.splice(+b.getAttribute("data-i"),1);if(!arr.length)delete S.days[k];save();render();openDay(k)}});
 function go(){var v=parseFloat($("am").value.replace(",","."));if(isNaN(v)||v<=0)return;(S.days[k]=S.days[k]||[]).push(v);save();render();openDay(k);$("am").focus()}
 $("ad").onclick=go;$("am").onkeydown=function(e){if(e.key==="Enter")go()};
}
var CH='<svg width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 5.5L4.5 2.5L7.5 5.5M1.5 9.5L4.5 12.5L7.5 9.5"/></svg>';
function curName(c){try{var n=new Intl.DisplayNames([LC],{type:"currency"}).of(c);return c+" · "+n.charAt(0).toUpperCase()+n.slice(1)}catch(e){return c+" "+CUR[c]}}
function pop(anchor,items,sel,pick){
 var cv=document.createElement("div"),p=document.createElement("div");cv.className="pcv";p.className="pop";
 function close(){cv.remove();p.remove()}
 items.forEach(function(it){var b=document.createElement("button");b.className="pi"+(it[0]===sel?" on":"");b.innerHTML="<i>✓</i><span>"+it[1]+"</span>";b.onclick=function(){close();pick(it[0])};p.appendChild(b)});
 cv.onclick=close;document.body.appendChild(cv);document.body.appendChild(p);
 var r=anchor.getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight,w=Math.min(300,vw-24);
 p.style.width=w+"px";p.style.maxHeight=Math.min(vh-24,Math.round(vh*0.62))+"px";
 var h=p.offsetHeight,top=r.bottom+8;if(top+h>vh-12){top=r.top-8-h;if(top<12)top=Math.max(12,vh-12-h)}
 p.style.top=top+"px";p.style.left=Math.min(Math.max(12,r.right-w),vw-w-12)+"px";
 requestAnimationFrame(function(){p.className="pop in"});
}
function openSettings(){
 var y=cm.getFullYear(),m=cm.getMonth(),key0=y+"-"+pad(m+1);
 var LN={ru:"Русский",en:"English",pl:"Polski",uk:"Українська"};
 var langs=[["auto",T("auto")],["ru",LN.ru],["en",LN.en],["pl",LN.pl],["uk",LN.uk]];
 var curs=[["auto",T("auto")+" ("+sysCur()+")"]].concat(Object.keys(CUR).map(function(c){return[c,curName(c)]}));
 var thms=[["auto",T("auto")],["dark",T("dark")],["light",T("light")]];
 function nm(a,v){for(var i=0;i<a.length;i++)if(a[i][0]===v)return a[i][1];return v}
 openSheet('<div class="grab"></div><div class="sh-h"><span></span><b>'+T("settings")+'</b><button class="done" id="dn">'+T("done")+'</button></div>'
  +'<div class="grp">'
  +'<div class="rw" id="rl"><span>'+T("lang")+'</span><span class="val">'+(S.lang==="auto"?T("auto"):LN[S.lang])+CH+'</span></div>'
  +'<div class="rw" id="rc"><span>'+T("cur")+'</span><span class="val">'+(S.cur==="auto"?T("auto")+" ("+sysCur()+")":S.cur+" "+CUR[ec()])+CH+'</span></div>'
  +'<div class="rw" id="rt"><span>'+T("theme")+'</span><span class="val">'+nm(thms,S.theme)+CH+'</span></div></div>'
  +'<div class="grp"><label class="rw"><span>'+T("lf")+' '+cm.toLocaleDateString(LC,{month:"long",year:"numeric"})+'</span><input id="li" type="number" inputmode="decimal" min="0" value="'+(lim(y,m)||"")+'" placeholder="'+T("eg")+'"></label></div>');
 function saveLim(){var v=parseFloat($("li").value.replace(",","."));if(!isNaN(v)&&v>=0){S.limits[key0]=v;save();render()}}
 $("li").onchange=saveLim;
 $("dn").onclick=function(){saveLim();closeSheet()};
 $("rl").onclick=function(){pop($("rl").querySelector(".val"),langs,S.lang,function(v){S.lang=v;save();setLang();render();openSettings()})};
 $("rc").onclick=function(){pop($("rc").querySelector(".val"),curs,S.cur,function(v){S.cur=v;save();render();openSettings()})};
 $("rt").onclick=function(){pop($("rt").querySelector(".val"),thms,S.theme,function(v){S.theme=v;save();applyTheme();openSettings()})};
}
$("gr").onclick=openSettings;$("cta").onclick=function(){openDay(key(T0))};
$("vw").onclick=function(){view="week";ws=(cm.getMonth()===now.getMonth()&&cm.getFullYear()===now.getFullYear())?mon(T0):mon(cm);render()};
$("vm").onclick=function(){view="month";var c=add(ws,3);cm=new Date(c.getFullYear(),c.getMonth(),1);render()};
$("pv").onclick=function(){if(view==="month")cm=new Date(cm.getFullYear(),cm.getMonth()-1,1);else ws=add(ws,-7);render()};

applyTheme();setLang();render();
